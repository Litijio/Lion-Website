
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIONS | RF Online Next</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #202b40, #090d16);
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 45px 30px;
            text-align: center;
            background: #151d2b;
            border: 1px solid #34445e;
            border-radius: 16px;
            box-shadow: 0 0 35px #000;
        }

        .logo {
            font-size: 58px;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 42px;
            letter-spacing: 8px;
            color: #55aaff;
            margin: 10px 0;
        }

        .subtitle {
            color: #aab8cc;
            letter-spacing: 3px;
            font-size: 13px;
        }

        .description {
            margin: 35px 0;
            color: #d0d8e5;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #5865F2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #4752c4;
            transform: scale(1.03);
        }

        footer {
            margin-top: 30px;
            font-size: 11px;
            color: #718096;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🦁</div>

        <h1>LIONS</h1>

        <div class="subtitle">RF ONLINE NEXT</div>

        <div class="description">
            <p>Panel de gestión del clan</p>
            <p>Bienvenido, guerrero.</p>
        </div>

        <button onclick="alert('El acceso con Discord se configurará en la próxima etapa.')">
            Acceder con Discord
        </button>

        <footer>
            LIONS CLAN MANAGEMENT SYSTEM
        </footer>

    </div>

</body>
</html>
