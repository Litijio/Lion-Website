
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIONS | RF Online Next</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle, #202b40, #090d16);
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            width: 100%;
            max-width: 1100px;
            margin: 30px auto 0;
            padding: 0 15px;
        }

        .header img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 440px;
            object-fit: cover;
            object-position: center;
            border: 1px solid #34445e;
            border-radius: 14px;
            box-shadow: 0 0 35px #000;
        }

        .container {
            width: 90%;
            max-width: 420px;
            margin: 30px auto;
            padding: 40px 30px;
            text-align: center;
            background: #151d2b;
            border: 1px solid #34445e;
            border-radius: 16px;
            box-shadow: 0 0 35px #000;
        }

        .description {
            margin: 10px 0 30px;
            color: #d0d8e5;
            font-size: 17px;
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #5865F2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #4752c4;
            transform: scale(1.02);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .logout {
            margin-top: 12px;
            background: #34445e;
        }

        .logout:hover {
            background: #455b7a;
        }

        #status {
            margin-top: 18px;
            color: #aab8cc;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        footer {
            margin-top: 25px;
            font-size: 11px;
            color: #718096;
        }

        @media (max-width: 600px) {
            .header {
                margin-top: 15px;
                padding: 0 10px;
            }

            .header img {
                border-radius: 8px;
            }

            .container {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <img src="logo-lions.png" alt="LIONS - RF Online Next">
    </div>

    <main class="container">

        <div class="description">
            <p>Panel de gestión del clan</p>
            <p id="welcome">Bienvenido, guerrero.</p>
        </div>

        <button id="loginButton">
            Acceder con Discord
        </button>

        <button id="logoutButton" class="logout" hidden>
            Cerrar sesión
        </button>

        <div id="status">Conectate para acceder al clan.</div>

        <footer>
            LIONS CLAN MANAGEMENT SYSTEM
        </footer>

    </main>

    <script type="module">
        import { createClient } from
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL =
            'https://itlooiobdrmfmxbxwggp.supabase.co';

        const SUPABASE_PUBLISHABLE_KEY =
            'sb_publishable_drzTLoO_X9qLdn1OX1ehkQ_0WUe29Ua';

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const loginButton = document.getElementById('loginButton');
        const logoutButton = document.getElementById('logoutButton');
        const status = document.getElementById('status');
        const welcome = document.getElementById('welcome');

        function updateInterface(session) {
            const user = session?.user;

            if (user) {
                const discordName =
                    user.user_metadata?.full_name ||
                    user.user_metadata?.name ||
                    user.user_metadata?.preferred_username ||
                    user.email ||
                    'Guerrero';

                welcome.textContent = 'Bienvenido, ' + discordName;
                status.textContent = 'Conectado como: ' + discordName;

                loginButton.hidden = true;
                logoutButton.hidden = false;
            } else {
                welcome.textContent = 'Bienvenido, guerrero.';
                status.textContent = 'Conectate para acceder al clan.';

                loginButton.hidden = false;
                loginButton.disabled = false;
                logoutButton.hidden = true;
                logoutButton.disabled = false;
            }
        }

        loginButton.addEventListener('click', async () => {
            loginButton.disabled = true;
            status.textContent = 'Conectando con Discord...';

            const redirectTo =
                window.location.origin + window.location.pathname;

            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'discord',
                options: {
                    redirectTo: redirectTo
                }
            });

            if (error) {
                status.textContent =
                    'No se pudo iniciar sesión: ' + error.message;
                loginButton.disabled = false;
            }
        });

        logoutButton.addEventListener('click', async () => {
            logoutButton.disabled = true;

            const { error } = await supabase.auth.signOut();

            if (error) {
                status.textContent =
                    'Error al cerrar sesión: ' + error.message;
                logoutButton.disabled = false;
            }
        });

        supabase.auth.onAuthStateChange((event, session) => {
            updateInterface(session);
        });

        const { data, error } = await supabase.auth.getSession();

        if (error) {
            status.textContent =
                'No se pudo verificar la sesión: ' + error.message;
        } else {
            updateInterface(data.session);
        }
    </script>

</body>
</html>
